name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run demo:task
      - run: npm run benchmark:task
      - run: npm run demo:task-lease
      - run: npm run check:syntax
      - run: npm run check:package

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:coverage

  packed-package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Install packed artifact in a fresh consumer project
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --json | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>process.stdout.write(JSON.parse(s)[0].filename));")"
          ROOT="$PWD"
          CONSUMER="$(mktemp -d)"
          cp test/consumer/package-smoke.mjs "$CONSUMER/package-smoke.mjs"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "$ROOT/$TARBALL" --ignore-scripts
          if npm ls ai --all >/dev/null 2>&1; then
            echo "FAIL -> packed Agent Authority unexpectedly installed the optional AI SDK"
            exit 1
          fi
          node package-smoke.mjs

  ai-sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Prove current Vercel AI SDK ToolLoopAgent executes through Agent Authority
        run: npm run test:ai-sdk

  live-github-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Prove Task Lease against live GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run demo:live-github

  live-derived-github-mutation:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Discover live resource, derive authority, mutate once, and prove non-amplification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run demo:live-derived-github
