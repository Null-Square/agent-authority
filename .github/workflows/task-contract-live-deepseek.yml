name: Task Authority Live DeepSeek Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - research/task-contract-pilot
    paths:
      - ".github/task-authority-live-trigger.txt"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      live_matrix: ${{ steps.live_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned AgentDojo
        run: python -m pip install -r benchmarks/agentdojo/requirements.txt

      - name: Verify frozen V1 mechanism
        run: |
          python benchmarks/task-contracts/validate-mechanism-freeze.py \
            benchmarks/task-contracts/live-eval-freeze.json \
            > /tmp/live-eval-freeze-validation.json

      - name: Compile publication evaluator
        run: |
          python -m py_compile \
            benchmarks/task-contracts/deepseek-publication-eval.py \
            benchmarks/task-contracts/run-deepseek-publication-eval.py \
            benchmarks/task-contracts/deepseek_thinking_transport.py \
            benchmarks/task-contracts/aggregate-deepseek-publication-eval.py \
            benchmarks/task-contracts/aggregate-deepseek-publication-partitions.py \
            benchmarks/task-contracts/validate-mechanism-freeze.py

      - name: Survey AgentDojo and build frozen 60-task cohort
        run: |
          python benchmarks/task-contracts/survey-agentdojo-coverage.py > /tmp/agentdojo-coverage-survey.json
          node benchmarks/task-contracts/build-agentdojo-expanded-cohort.mjs \
            /tmp/agentdojo-coverage-survey.json \
            /tmp/agentdojo-expanded-cohort.json
          node benchmarks/task-contracts/emit-strict-contracts.mjs \
            /tmp/agentdojo-expanded-cohort.json \
            /tmp/task-contract-runtime-bundle.json

      - name: Materialize preregistered live plan
        run: |
          python benchmarks/task-contracts/run-deepseek-publication-eval.py \
            --contracts /tmp/task-contract-runtime-bundle.json \
            --mode plan \
            --suite all \
            --trial 0 \
            --output /tmp/live-eval-plan.json

      - name: Build 48-shard recovery matrix
        id: live_matrix
        run: |
          matrix=$(python - <<'PY'
          import json
          partitions = {"slack": 5, "banking": 3, "workspace": 6, "travel": 2}
          rows = []
          for suite, count in partitions.items():
              for trial in range(3):
                  for partition in range(count):
                      rows.append({
                          "suite": suite,
                          "trial": trial,
                          "partition": partition,
                          "partitions": count,
                      })
          print(json.dumps({"include": rows}, separators=(",", ":")))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload frozen live inputs
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-inputs
          path: |
            /tmp/task-contract-runtime-bundle.json
            /tmp/live-eval-plan.json
            /tmp/live-eval-freeze-validation.json
            benchmarks/task-contracts/live-eval-freeze.json
            benchmarks/task-contracts/LIVE_EVAL_PROTOCOL.md
          if-no-files-found: error
          retention-days: 30

  calibrate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned AgentDojo client stack
        run: python -m pip install -r benchmarks/agentdojo/requirements.txt

      - name: Verify DeepSeek Pro thinking-mode multi-turn tool transport
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured in repository Actions secrets." >&2
            exit 2
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import openai

          sys.path.insert(0, "benchmarks/task-contracts")
          from deepseek_thinking_transport import DeepSeekThinkingClientAdapter

          raw_client = openai.OpenAI(
              api_key=os.environ["DEEPSEEK_API_KEY"],
              base_url=os.environ.get("DEEPSEEK_BASE_URL", "https://api.deepseek.com"),
              timeout=120.0,
              max_retries=3,
          )
          client = DeepSeekThinkingClientAdapter(raw_client)
          tools = [{
              "type": "function",
              "function": {
                  "name": "ping",
                  "description": "Return a calibration marker.",
                  "parameters": {
                      "type": "object",
                      "properties": {"value": {"type": "string"}},
                      "required": ["value"],
                      "additionalProperties": False,
                  },
              },
          }]
          messages = [
              {
                  "role": "system",
                  "content": (
                      "You are a tool-use calibration agent. When asked to calibrate, "
                      "call ping exactly once. After receiving the tool result, answer "
                      "exactly calibration-complete and do not call another tool."
                  ),
              },
              {"role": "user", "content": "Calibrate now. Call ping with value calibration-ok."},
          ]

          first = None
          first_message = None
          for _ in range(3):
              first = client.chat.completions.create(
                  model="deepseek-v4-pro",
                  messages=messages,
                  tools=tools,
                  tool_choice="auto",
              )
              candidate = first.choices[0].message
              if candidate.tool_calls:
                  first_message = candidate
                  break
          if first_message is None:
              raise SystemExit("DeepSeek Pro did not produce a calibration tool call after 3 attempts")

          reasoning = getattr(first_message, "reasoning_content", None)
          if reasoning is None:
              reasoning = (getattr(first_message, "model_extra", None) or {}).get("reasoning_content")
          if not reasoning:
              raise SystemExit("DeepSeek Pro calibration response lacked thinking-mode reasoning_content")

          call = first_message.tool_calls[0]
          if call.function.name != "ping":
              raise SystemExit(f"unexpected calibration tool: {call.function.name}")
          args = json.loads(call.function.arguments)
          if args.get("value") != "calibration-ok":
              raise SystemExit(f"unexpected calibration arguments: {args}")

          # Deliberately omit reasoning_content here to reproduce AgentDojo
          # 0.1.35's historical wire format. The transport adapter must recover
          # the exact reasoning state associated with the tool-call ID.
          assistant_without_reasoning = {
              "role": "assistant",
              "content": first_message.content,
              "tool_calls": [{
                  "id": call.id,
                  "type": "function",
                  "function": {
                      "name": call.function.name,
                      "arguments": call.function.arguments,
                  },
              }],
          }
          second_messages = [
              *messages,
              assistant_without_reasoning,
              {
                  "role": "tool",
                  "tool_call_id": call.id,
                  "content": "pong: calibration-ok",
              },
          ]
          second = client.chat.completions.create(
              model="deepseek-v4-pro",
              messages=second_messages,
              tools=tools,
              tool_choice="auto",
          )
          final_message = second.choices[0].message
          if final_message.tool_calls:
              raise SystemExit("DeepSeek Pro called a second tool instead of completing calibration")
          if (final_message.content or "").strip() != "calibration-complete":
              raise SystemExit(f"unexpected calibration completion: {final_message.content!r}")

          print(json.dumps({
              "status": "passed",
              "provider": "deepseek",
              "model": "deepseek-v4-pro",
              "thinking_mode": "enabled",
              "reasoning_effort": "high",
              "first_turn_tool": "ping",
              "reasoning_bridge": "validated_by_stripped-two-turn-replay",
              "second_turn": "calibration-complete",
          }))
          PY

  live:
    needs: [prepare, calibrate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.live_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned AgentDojo
        run: python -m pip install -r benchmarks/agentdojo/requirements.txt

      - name: Verify frozen V1 mechanism
        run: python benchmarks/task-contracts/validate-mechanism-freeze.py benchmarks/task-contracts/live-eval-freeze.json

      - name: Download frozen live inputs
        uses: actions/download-artifact@v4
        with:
          name: live-eval-inputs
          path: /tmp/live-inputs

      - name: Run DeepSeek Pro live partition
        id: live_run
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-pro
          LIVE_SUITE: ${{ matrix.suite }}
          LIVE_TRIAL: ${{ matrix.trial }}
          LIVE_PARTITION_INDEX: ${{ matrix.partition }}
          LIVE_PARTITION_COUNT: ${{ matrix.partitions }}
        run: |
          set +e
          output="/tmp/live-shard-${LIVE_SUITE}-${LIVE_TRIAL}-${LIVE_PARTITION_INDEX}-of-${LIVE_PARTITION_COUNT}.json"
          python benchmarks/task-contracts/run-deepseek-publication-eval.py \
            --contracts /tmp/live-inputs/task-contract-runtime-bundle.json \
            --mode run \
            --suite "$LIVE_SUITE" \
            --trial "$LIVE_TRIAL" \
            --model deepseek-v4-pro \
            --output "$output"
          status=$?
          if [ ! -s "$output" ]; then
            printf '{"protocol":"live-eval-v1","mode":"live-shard","model":"deepseek-v4-pro","suite":"%s","trial":%s,"rows":[],"startup_error":true}\n' \
              "$LIVE_SUITE" "$LIVE_TRIAL" > "$output"
          fi
          exit "$status"

      - name: Upload live partition checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shard-${{ matrix.suite }}-${{ matrix.trial }}-${{ matrix.partition }}-of-${{ matrix.partitions }}
          path: /tmp/live-shard-${{ matrix.suite }}-${{ matrix.trial }}-${{ matrix.partition }}-of-${{ matrix.partitions }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.prepare.result == 'success' && needs.calibrate.result == 'success'
    needs: [prepare, calibrate, live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download frozen live inputs
        uses: actions/download-artifact@v4
        with:
          name: live-eval-inputs
          path: /tmp/live-inputs

      - name: Download all live partitions
        uses: actions/download-artifact@v4
        with:
          pattern: live-shard-*
          path: /tmp/live-shards
          merge-multiple: true

      - name: Aggregate preregistered result
        run: |
          python benchmarks/task-contracts/aggregate-deepseek-publication-partitions.py \
            /tmp/live-shards/live-shard-*.json \
            --plan /tmp/live-inputs/live-eval-plan.json \
            --output /tmp/live-eval-result.json

      - name: Upload publication-grade live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-authority-live-deepseek-result
          path: |
            /tmp/live-eval-result.json
            /tmp/live-inputs/live-eval-plan.json
            /tmp/live-inputs/live-eval-freeze-validation.json
            /tmp/live-shards/live-shard-*.json
          if-no-files-found: warn
          retention-days: 30
