name: Task Authority Research Reproduction (Offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgentDojo research dependency
        run: python -m pip install -r benchmarks/agentdojo/requirements.txt

      - name: Verify frozen V1 mechanism
        run: |
          python benchmarks/task-contracts/validate-mechanism-freeze.py \
            benchmarks/task-contracts/live-eval-freeze.json \
            > /tmp/live-eval-freeze-validation.json

      - name: Audit AgentDojo prompt and trace consistency
        run: python benchmarks/task-contracts/audit-agentdojo-oracle-consistency.py > /tmp/agentdojo-oracle-consistency.json

      - name: Build frozen 60-task cohort
        run: |
          python benchmarks/task-contracts/survey-agentdojo-coverage.py > /tmp/agentdojo-coverage-survey.json
          node benchmarks/task-contracts/build-agentdojo-expanded-cohort.mjs \
            /tmp/agentdojo-coverage-survey.json \
            /tmp/agentdojo-expanded-cohort.json
          node benchmarks/task-contracts/emit-strict-contracts.mjs \
            /tmp/agentdojo-expanded-cohort.json \
            /tmp/task-contract-runtime-bundle.json

      - name: Materialize the frozen live plan without API calls
        run: |
          python benchmarks/task-contracts/run-deepseek-publication-eval.py \
            --contracts /tmp/task-contract-runtime-bundle.json \
            --mode plan \
            --suite all \
            --trial 0 \
            --output /tmp/live-eval-plan.json

      - name: Run corrected strict contract gate
        run: |
          set +e
          set -o pipefail
          node benchmarks/task-contracts/run-strict-automatic-contract-pilot.mjs \
            /tmp/agentdojo-expanded-cohort.json | tee /tmp/task-contract-strict-expanded.json
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Run exact transplant audit
        run: |
          node benchmarks/task-contracts/run-exact-transplant-audit.mjs \
            /tmp/agentdojo-expanded-cohort.json \
            > /tmp/task-contract-exact-transplants.json

      - name: Validate corrected 60-task strict gate
        run: |
          node benchmarks/task-contracts/validate-expanded-strict-gate.mjs \
            /tmp/task-contract-strict-expanded.json \
            /tmp/task-contract-exact-transplants.json \
            > /tmp/task-contract-strict-expanded-validated.json

      - name: Run deterministic provider-boundary families
        run: |
          python benchmarks/task-contracts/model_loop_gate_identity_adversary_with_aggregate.py \
            --contracts /tmp/task-contract-runtime-bundle.json \
            --mode deterministic \
            > /tmp/task-contract-provider-boundary.json

          python benchmarks/task-contracts/provider_attack_family_gate_with_aggregate.py \
            --contracts /tmp/task-contract-runtime-bundle.json \
            > /tmp/task-contract-provider-families.json

          python benchmarks/task-contracts/aggregate_provider_gate.py \
            --contracts /tmp/task-contract-runtime-bundle.json \
            > /tmp/task-contract-aggregate-provider.json

      - name: Require provider-boundary safety and utility gates
        run: |
          node benchmarks/task-contracts/validate-provider-perfect.mjs \
            /tmp/task-contract-provider-boundary.json \
            /tmp/task-contract-provider-families.json \
            /tmp/task-contract-aggregate-provider.json \
            > /tmp/task-contract-provider-perfect.json

      - name: Run selection-witness generalization gates
        run: |
          node benchmarks/task-contracts/run-aggregate-selector-pilot.mjs \
            > /tmp/task-contract-aggregate-selector.json
          node benchmarks/task-contracts/run-selector-witness-pilot.mjs \
            > /tmp/task-contract-selector-witness.json

      - name: Upload offline reproduction checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: task-authority-research-offline-checkpoint
          path: |
            /tmp/live-eval-freeze-validation.json
            /tmp/live-eval-plan.json
            /tmp/agentdojo-oracle-consistency.json
            /tmp/agentdojo-coverage-survey.json
            /tmp/agentdojo-expanded-cohort.json
            /tmp/task-contract-runtime-bundle.json
            /tmp/task-contract-strict-expanded.json
            /tmp/task-contract-strict-expanded-validated.json
            /tmp/task-contract-exact-transplants.json
            /tmp/task-contract-provider-boundary.json
            /tmp/task-contract-provider-families.json
            /tmp/task-contract-aggregate-provider.json
            /tmp/task-contract-provider-perfect.json
            /tmp/task-contract-aggregate-selector.json
            /tmp/task-contract-selector-witness.json
          if-no-files-found: error
          retention-days: 30
