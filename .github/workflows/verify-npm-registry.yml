name: Verify npm registry

on:
  pull_request:
    paths:
      - .github/workflows/verify-npm-registry.yml
  workflow_dispatch:
    inputs:
      version:
        description: Package version to verify; defaults to package.json
        required: false
        type: string

permissions:
  contents: read

jobs:
  registry-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve requested version
        id: package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}" 
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify registry visibility
        shell: bash
        run: |
          set -euo pipefail
          actual=$(npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version)
          test "$actual" = "${{ steps.package.outputs.version }}"

      - name: Verify clean consumer install and Google provider export
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" --ignore-scripts
          node --input-type=module <<'NODE'
          import { createTaskLease } from '@nullsquare/agent-authority/task-lease';
          import { createGoogleProviderAdapter } from '@nullsquare/agent-authority/providers/google';
          if (typeof createTaskLease !== 'function') throw new Error('Task Lease export missing');
          if (typeof createGoogleProviderAdapter !== 'function') throw new Error('Google provider export missing');
          console.log('registry consumer exports verified');
          NODE
