name: Verify npm registry

on:
  pull_request:
    paths:
      - .github/workflows/verify-npm-registry.yml
  workflow_dispatch:
    inputs:
      version:
        description: Package version to verify; defaults to package.json
        required: false
        type: string

permissions:
  contents: read

jobs:
  registry-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve requested version
        id: package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}" 
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify registry visibility
        shell: bash
        run: |
          set -euo pipefail
          actual=$(npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version)
          test "$actual" = "${{ steps.package.outputs.version }}"

      - name: Verify clean registry consumer and current public behavior
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/test/consumer/package-smoke.mjs" "$CONSUMER/package-smoke.mjs"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" --ignore-scripts
          if npm ls ai --all >/dev/null 2>&1; then
            echo "FAIL -> registry package unexpectedly installed optional AI SDK"
            exit 1
          fi
          node package-smoke.mjs
